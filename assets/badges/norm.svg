<svg xmlns="http://www.w3.org/2000/svg" width="180" height="40" viewBox="0 0 180 40">
  <defs>
    <style>
      .pulse { animation: pulse 2s infinite; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    </style>
  </defs>
  <rect fill="#161b22" stroke="#238636" stroke-width="1" x="0" y="0" width="180" height="40" rx="8" />
  <circle cx="20" cy="20" r="6" fill="#3fb950" class="pulse" />
  <text x="38" y="25" font-family="sans-serif" font-size="12" fill="#3fb950" font-weight="600">NORMINETTE OK</text>
</svg>