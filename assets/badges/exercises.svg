<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <defs>
    <style>
      .bg { fill: #161b22; stroke: #30363d; }
      .num { font-family: 'Segoe UI', monospace; font-size: 28px; fill: #58a6ff; font-weight: 700; }
      .label { font-family: sans-serif; font-size: 11px; fill: #8b949e; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="200" height="60" rx="10" />
  <text x="20" y="38" class="num">
    <tspan>62</tspan>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
  </text>
  <text x="70" y="30" class="label">EXERCISES</text>
  <text x="70" y="45" class="label">COMPLETED</text>
</svg>