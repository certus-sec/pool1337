<svg xmlns="http://www.w3.org/2000/svg" width="320" height="56" viewBox="0 0 320 56">
  <defs>
    <filter id="glow-C13">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .bg-{ fill: #161b22; stroke: #9e6a03; stroke-width: 1; }
      .icon-{ fill: #d29922; font-family: sans-serif; font-size: 16px; font-weight: 700; }
      .name-{ fill: #c9d1d9; font-family: -apple-system, sans-serif; font-size: 14px; font-weight: 600; }
      .meta-{ fill: #8b949e; font-family: monospace; font-size: 11px; }
      .bar-bg-{ fill: #21262d; rx: 2; }
      .bar-fill-{ fill: #d29922; rx: 2; filter: url(#glow-C13); }
    </style>
  </defs>

  <rect class="bg-" x="0" y="0" width="320" height="56" rx="10" />

  <!-- Module ID -->
  <text x="12" y="22" class="icon-">🟡 C13</text>

  <!-- Focus text -->
  <text x="12" y="42" class="meta-">0 exercises</text>

  <!-- Status pill -->
  <rect x="250" y="12" width="58" height="22" rx="11" fill="#d29922" opacity="0.15" />
  <text x="279" y="27" text-anchor="middle" fill="#d29922" font-family="sans-serif" font-size="10" font-weight="700">PENDING</text>

  <!-- Mini progress bar -->
  <rect class="bar-bg-" x="12" y="48" width="120" height="4" />
  <rect class="bar-fill-" x="12" y="48" width="0" height="4">
    <animate attributeName="width" from="0" to="0" dur="1s" fill="freeze" />
  </rect>
</svg>